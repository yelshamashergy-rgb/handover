<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Handover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#125C49" />
      <stop offset="1" stop-color="#0A3A2E" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EBCD86" />
      <stop offset="0.55" stop-color="#C99B46" />
      <stop offset="1" stop-color="#A8772E" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#glow)" />

  <g fill="url(#brass)">
    <!-- hexagonal bow (ring) -->
    <path fill-rule="evenodd" d="
      M512 184 L674.8 278 L674.8 466 L512 560 L349.2 466 L349.2 278 Z
      M512 276 L595.1 324 L595.1 420 L512 468 L428.9 420 L428.9 324 Z" />
    <!-- stem -->
    <rect x="486" y="536" width="52" height="266" rx="26" />
    <!-- teeth -->
    <rect x="538" y="694" width="66" height="40" rx="12" />
    <rect x="538" y="752" width="48" height="34" rx="12" />
  </g>
</svg>
